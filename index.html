<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  
  <!-- PWA Essential Meta Tags -->
  <meta name="theme-color" content="#1a5e2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Holy Quran">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Holy Quran">
  
  <title>Holy Quran | Read & Listen</title>
  
  <!-- Manifest Link -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- iOS Icon -->
  <link rel="apple-touch-icon" href="/icon-512.png">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0d3b1a 0%, #1a5e2a 30%, #0d3b1a 60%, #1a4d24 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .quran-container {
      width: 100%;
      max-width: 850px;
      height: 100vh;
      height: 100dvh;
      background: rgba(255, 252, 245, 0.97);
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.4);
      padding: 1rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .quran-container {
        border-radius: 2.5rem;
        height: auto;
        max-height: 95vh;
        margin: 1rem;
      }
      body {
        padding: 1rem;
      }
    }

    .install-prompt {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #1a5e2a, #0d3b1a);
      color: #d4a843;
      padding: 1rem 2rem;
      border-radius: 3rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 999;
      display: none;
      align-items: center;
      gap: 1rem;
      font-weight: 600;
      cursor: pointer;
      animation: slideUp 0.5s ease;
      border: 2px solid #d4a843;
    }

    .install-prompt.show {
      display: flex;
    }

    @keyframes slideUp {
      from { transform: translateX(-50%) translateY(100px); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }

    .install-prompt button {
      background: #d4a843;
      color: #1a5e2a;
      border: none;
      padding: 0.5rem 1.5rem;
      border-radius: 2rem;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #e8d5a3;
      padding-bottom: 0.5rem;
      flex-shrink: 0;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .app-icon {
      width: 45px;
      height: 45px;
      background: linear-gradient(135deg, #d4a843, #b8922e);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(212, 168, 67, 0.4);
      font-family: serif;
      font-size: 20px;
      color: #1a5e2a;
      font-weight: bold;
    }

    .header-title h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a5e2a;
    }

    .header-stats {
      display: flex;
      gap: 0.5rem;
    }

    .stat-badge {
      background: #faf3e6;
      padding: 0.4rem 0.8rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 0.8rem;
      color: #1a5e2a;
      border: 2px solid #d4a843;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .controls-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
      flex-shrink: 0;
    }

    .surah-select {
      flex: 1;
      min-width: 150px;
      padding: 0.7rem 1rem;
      border-radius: 2rem;
      border: 2px solid #d4a843;
      background: white;
      font-weight: 500;
      color: #1a5e2a;
      outline: none;
      cursor: pointer;
      font-size: 0.9rem;
      appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="%231a5e2a"><path d="M7 10l5 5 5-5z"/></svg>');
      background-repeat: no-repeat;
      background-position: right 1rem center;
      background-size: 1.2rem;
    }

    .control-btn {
      padding: 0.6rem 1rem;
      border-radius: 2rem;
      border: 2px solid #d4a843;
      background: white;
      font-weight: 600;
      color: #1a5e2a;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.85rem;
    }

    .control-btn:active {
      background: #d4a843;
      color: white;
      transform: scale(0.95);
    }

    .control-btn.active {
      background: #1a5e2a;
      color: #d4a843;
      border-color: #1a5e2a;
    }

    .control-btn.reciter-btn {
      background: #1a5e2a;
      color: #d4a843;
      border-color: #1a5e2a;
    }

    .search-box {
      display: flex;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      padding: 0.7rem 1rem;
      border-radius: 2rem;
      border: 2px solid #d4a843;
      outline: none;
      font-size: 0.9rem;
      color: #1a5e2a;
    }

    .verses-list {
      flex: 1;
      overflow-y: auto;
      padding-right: 0.3rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      -webkit-overflow-scrolling: touch;
    }

    .verse-card {
      background: #ffffff;
      border: 2px solid #e8d5a3;
      border-radius: 1.2rem;
      padding: 1rem;
      display: flex;
      align-items: flex-start;
      gap: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .verse-card:active {
      background: #fefcf7;
      border-color: #d4a843;
      transform: scale(0.98);
    }

    .verse-card.playing {
      background: linear-gradient(135deg, #fef9e7, #fef3d5);
      border: 2px solid #d4a843;
      box-shadow: 0 0 0 4px rgba(212, 168, 67, 0.2);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 4px rgba(212, 168, 67, 0.2); }
      50% { box-shadow: 0 0 0 8px rgba(212, 168, 67, 0.1); }
      100% { box-shadow: 0 0 0 4px rgba(212, 168, 67, 0.2); }
    }

    .verse-number {
      background: linear-gradient(135deg, #1a5e2a, #0d3b1a);
      color: #d4a843;
      font-weight: 700;
      border-radius: 50%;
      min-width: 35px;
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .verse-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      min-width: 0;
    }

    .arabic-text {
      font-family: 'Traditional Arabic', 'Scheherazade New', 'Amiri', serif;
      font-size: 1.7rem;
      line-height: 2.3rem;
      color: #1a3a1a;
      text-align: right;
      direction: rtl;
      font-weight: 500;
    }

    .translation {
      font-size: 0.9rem;
      color: #5a5244;
      line-height: 1.4;
      border-left: 3px solid #d4a843;
      padding-left: 0.7rem;
    }

    .verse-actions {
      display: flex;
      gap: 0.3rem;
      margin-top: 0.2rem;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #1a5e2a;
      font-size: 1rem;
      cursor: pointer;
      padding: 0.4rem 0.5rem;
      border-radius: 2rem;
    }

    .icon-btn:active {
      color: #d4a843;
      background: rgba(26, 94, 42, 0.1);
    }

    .icon-btn.bookmark-active {
      color: #d4a843;
    }

    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #1a5e2a;
      font-size: 0.8rem;
      border-top: 2px solid #e8d5a3;
      padding-top: 0.5rem;
      flex-shrink: 0;
    }

    .page-btn {
      background: #faf3e6;
      border: 2px solid #d4a843;
      padding: 0.4rem 0.8rem;
      border-radius: 1.5rem;
      cursor: pointer;
      font-weight: 600;
      color: #1a5e2a;
      font-size: 0.8rem;
    }

    .page-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .audio-status {
      color: #d4a843;
      font-weight: 600;
    }

    .verses-list::-webkit-scrollbar {
      width: 4px;
    }
    .verses-list::-webkit-scrollbar-track {
      background: #faf3e6;
    }
    .verses-list::-webkit-scrollbar-thumb {
      background: #d4a843;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<!-- Install Prompt -->
<div class="install-prompt" id="installPrompt">
  <span>📱 Install Holy Quran App</span>
  <button id="installButton">Install</button>
</div>

<div class="quran-container">
  <div class="app-header">
    <div class="header-title">
      <div class="app-icon">﷽</div>
      <h1>Al-Quran Al-Kareem</h1>
    </div>
    <div class="header-stats">
      <div class="stat-badge">
        <i class="fas fa-bookmark"></i> <span id="bookmarkCount">0</span>
      </div>
      <div class="stat-badge">
        <i class="fas fa-star"></i> <span id="surahNameDisplay">Al-Fatiha</span>
      </div>
    </div>
  </div>

  <div class="controls-row">
    <select class="surah-select" id="surahSelect"></select>
    <button class="control-btn" id="autoPlayBtn">
      <i class="fas fa-play-circle"></i> Auto
    </button>
    <button class="control-btn reciter-btn" id="reciterBtn">
      <i class="fas fa-microphone"></i> Alafasy
    </button>
    <button class="control-btn" id="stopAudioBtn">
      <i class="fas fa-stop-circle"></i>
    </button>
  </div>

  <div class="search-box">
    <input type="text" class="search-input" id="searchInput" placeholder="Search in translation...">
    <button class="control-btn" id="searchBtn"><i class="fas fa-search"></i></button>
    <button class="control-btn" id="clearSearchBtn"><i class="fas fa-times"></i></button>
  </div>

  <div class="verses-list" id="versesContainer">
    <div style="text-align:center; padding:2rem; color:#1a5e2a;">Loading...</div>
  </div>

  <div class="footer-bar">
    <div>
      <button class="page-btn" id="prevSurahBtn" disabled><i class="fas fa-chevron-left"></i></button>
      <span id="pageIndicator" style="margin:0 0.5rem;">1/114</span>
      <button class="page-btn" id="nextSurahBtn"><i class="fas fa-chevron-right"></i></button>
    </div>
    <div class="audio-status">
      <i class="fas fa-volume-up"></i> <span>Tap verse to play</span>
    </div>
    <button class="control-btn" id="clearBookmarksBtn"><i class="fas fa-trash-alt"></i></button>
  </div>
</div>

<script>
// ============ PWA INSTALLATION ============
let deferredPrompt;
const installPrompt = document.getElementById('installPrompt');
const installButton = document.getElementById('installButton');

// Check if already installed
const isAppInstalled = window.matchMedia('(display-mode: standalone)').matches || 
                       window.navigator.standalone;

// Listen for install prompt
window.addEventListener('beforeinstallprompt', (e) => {
  // Prevent Chrome 67 and earlier from automatically showing the prompt
  e.preventDefault();
  // Stash the event so it can be triggered later
  deferredPrompt = e;
  
  // Show the install prompt after 3 seconds
  if (!isAppInstalled) {
    setTimeout(() => {
      installPrompt.classList.add('show');
    }, 3000);
  }
  
  console.log('✅ beforeinstallprompt fired - App is installable!');
});

// Install button click
installButton.addEventListener('click', async () => {
  if (!deferredPrompt) {
    // Fallback for iOS
    alert('To install: Tap the Share button and then "Add to Home Screen"');
    return;
  }
  
  // Show the install prompt
  deferredPrompt.prompt();
  
  // Wait for the user to respond to the prompt
  const { outcome } = await deferredPrompt.userChoice;
  console.log(`User response: ${outcome}`);
  
  // Clear the deferredPrompt variable
  deferredPrompt = null;
  
  // Hide the install prompt
  installPrompt.classList.remove('show');
});

// Hide prompt if app is already installed
window.addEventListener('appinstalled', () => {
  console.log('✅ App installed successfully!');
  installPrompt.classList.remove('show');
  deferredPrompt = null;
});

// Check if app was installed previously
if (isAppInstalled) {
  console.log('📱 App is running in standalone mode');
}

// ============ REGISTER SERVICE WORKER ============
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(registration => {
        console.log('✅ Service Worker registered with scope:', registration.scope);
      })
      .catch(error => {
        console.log('❌ Service Worker registration failed:', error);
      });
  });
}

// ============ QURAN APP LOGIC ============
const API_BASE = 'https://api.alquran.cloud/v1';

let allSurahs = [];
let currentSurahNumber = 1;
let currentSurahData = null;
let currentAudio = null;
let autoPlayEnabled = false;
let bookmarks = new Set(JSON.parse(localStorage.getItem('quranBookmarks') || '[]'));
let currentReciter = 'ar.alafasy';
let searchQuery = '';

const reciters = [
  { id: 'ar.alafasy', name: 'Mishary Alafasy' },
  { id: 'ar.abdurrahmaansudais', name: 'Abdurrahman Sudais' },
  { id: 'ar.abdulsamad', name: 'Abdul Basit' },
  { id: 'ar.hudhaify', name: 'Ali Hudhaify' },
  { id: 'ar.mahermuaiqly', name: 'Maher Al-Muaiqly' },
  { id: 'ar.ahmedajamy', name: 'Ahmed Al-Ajamy' },
];

// DOM Elements
const surahSelect = document.getElementById('surahSelect');
const versesContainer = document.getElementById('versesContainer');
const bookmarkCount = document.getElementById('bookmarkCount');
const surahNameDisplay = document.getElementById('surahNameDisplay');
const autoPlayBtn = document.getElementById('autoPlayBtn');
const reciterBtn = document.getElementById('reciterBtn');
const stopAudioBtn = document.getElementById('stopAudioBtn');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const clearSearchBtn = document.getElementById('clearSearchBtn');
const prevSurahBtn = document.getElementById('prevSurahBtn');
const nextSurahBtn = document.getElementById('nextSurahBtn');
const pageIndicator = document.getElementById('pageIndicator');
const audioStatus = document.querySelector('.audio-status span');
const clearBookmarksBtn = document.getElementById('clearBookmarksBtn');

// Functions
function updateBookmarks() {
  localStorage.setItem('quranBookmarks', JSON.stringify([...bookmarks]));
  bookmarkCount.textContent = bookmarks.size;
}

function isBookmarked(surah, verse) {
  return bookmarks.has(`${surah}:${verse}`);
}

function toggleBookmark(surah, verse) {
  const key = `${surah}:${verse}`;
  bookmarks.has(key) ? bookmarks.delete(key) : bookmarks.add(key);
  updateBookmarks();
  searchQuery ? performSearch() : renderVerses(currentSurahData);
}

function stopAudio() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }
  document.querySelectorAll('.verse-card').forEach(c => c.classList.remove('playing'));
}

async function getAudioUrl(surah, verse, reciter) {
  try {
    const res = await fetch(`${API_BASE}/ayah/${surah}:${verse}/${reciter}`);
    const data = await res.json();
    return data?.data?.audio || null;
  } catch { return null; }
}

async function playAudio(surah, verse, card) {
  stopAudio();
  document.querySelectorAll('.verse-card').forEach(c => c.classList.remove('playing'));
  
  if (card) {
    card.classList.add('playing');
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  
  audioStatus.textContent = 'Loading...';
  
  const url = await getAudioUrl(surah, verse, currentReciter);
  if (!url) {
    audioStatus.textContent = '⚠️ Error';
    setTimeout(() => audioStatus.textContent = 'Tap verse to play', 3000);
    return;
  }
  
  const audio = new Audio(url);
  currentAudio = audio;
  
  audio.addEventListener('playing', () => {
    audioStatus.textContent = '▶ Playing...';
  });
  
  audio.addEventListener('ended', () => {
    card?.classList.remove('playing');
    audioStatus.textContent = 'Tap verse to play';
    
    if (autoPlayEnabled && currentSurahData) {
      const next = verse + 1;
      if (next <= currentSurahData.numberOfAyahs) {
        setTimeout(() => {
          const nextCard = document.querySelector(`[data-verse="${next}"]`);
          if (nextCard) playAudio(surah, next, nextCard);
        }, 300);
      } else if (currentSurahNumber < 114) {
        setTimeout(() => loadSurah(currentSurahNumber + 1), 1000);
      }
    }
  });
  
  audio.addEventListener('error', () => {
    audioStatus.textContent = '⚠️ Error';
    card?.classList.remove('playing');
    setTimeout(() => audioStatus.textContent = 'Tap verse to play', 3000);
  });
  
  audio.play();
}

async function fetchSurahs() {
  try {
    const res = await fetch(`${API_BASE}/surah`);
    const data = await res.json();
    if (data.code === 200) {
      allSurahs = data.data;
      surahSelect.innerHTML = allSurahs.map(s => 
        `<option value="${s.number}">${s.number}. ${s.englishName}</option>`
      ).join('');
      surahSelect.value = currentSurahNumber;
    }
  } catch (e) { console.error('Failed to load surahs'); }
}

async function fetchSurah(num) {
  try {
    const [arabicRes, transRes] = await Promise.all([
      fetch(`${API_BASE}/surah/${num}`),
      fetch(`${API_BASE}/surah/${num}/en.sahih`)
    ]);
    const arabic = await arabicRes.json();
    const trans = await transRes.json();
    
    if (arabic.code === 200 && trans.code === 200) {
      return {
        number: num,
        name: arabic.data.name,
        englishName: arabic.data.englishName,
        numberOfAyahs: arabic.data.numberOfAyahs,
        verses: arabic.data.ayahs.map((a, i) => ({
          numberInSurah: a.numberInSurah,
          arabic: a.text,
          translation: trans.data.ayahs[i]?.text || '',
        })),
      };
    }
  } catch {}
  return null;
}

function renderVerses(data) {
  if (!data?.verses) return;
  
  currentSurahData = data;
  surahNameDisplay.textContent = data.englishName;
  pageIndicator.textContent = `${data.number}/114`;
  surahSelect.value = data.number;
  currentSurahNumber = data.number;
  prevSurahBtn.disabled = currentSurahNumber <= 1;
  nextSurahBtn.disabled = currentSurahNumber >= 114;
  
  versesContainer.innerHTML = data.verses.map(v => `
    <div class="verse-card" data-verse="${v.numberInSurah}">
      <div class="verse-number">${v.numberInSurah}</div>
      <div class="verse-content">
        <div class="arabic-text">${v.arabic}</div>
        <div class="translation">${v.translation}</div>
        <div class="verse-actions">
          <button class="icon-btn bookmark-btn ${isBookmarked(data.number, v.numberInSurah) ? 'bookmark-active' : ''}" data-action="bookmark">
            <i class="fas fa-bookmark"></i>
          </button>
          <button class="icon-btn play-btn" data-action="play">
            <i class="fas fa-play-circle"></i>
          </button>
          <button class="icon-btn copy-btn" data-action="copy">
            <i class="fas fa-copy"></i>
          </button>
        </div>
      </div>
    </div>
  `).join('');
  
  // Attach events
  versesContainer.querySelectorAll('.verse-card').forEach(card => {
    const verseNum = parseInt(card.dataset.verse);
    
    card.addEventListener('click', (e) => {
      if (!e.target.closest('button')) playAudio(data.number, verseNum, card);
    });
    
    card.querySelector('[data-action="bookmark"]').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleBookmark(data.number, verseNum);
    });
    
    card.querySelector('[data-action="play"]').addEventListener('click', (e) => {
      e.stopPropagation();
      playAudio(data.number, verseNum, card);
    });
    
    card.querySelector('[data-action="copy"]').addEventListener('click', (e) => {
      e.stopPropagation();
      const verse = data.verses.find(v => v.numberInSurah === verseNum);
      navigator.clipboard.writeText(`${verse.arabic}\n${verse.translation}`);
    });
  });
  
  versesContainer.scrollTop = 0;
}

async function loadSurah(num) {
  stopAudio();
  const data = await fetchSurah(num);
  if (data) renderVerses(data);
}

function performSearch() {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) return renderVerses(currentSurahData);
  searchQuery = q;
  const filtered = currentSurahData?.verses?.filter(v => 
    v.translation.toLowerCase().includes(q) || v.arabic.includes(q)
  ) || [];
  
  versesContainer.innerHTML = filtered.length ? 
    filtered.map(v => `
      <div class="verse-card" data-verse="${v.numberInSurah}">
        <div class="verse-number">${v.numberInSurah}</div>
        <div class="verse-content">
          <div class="arabic-text">${v.arabic}</div>
          <div class="translation">${v.translation}</div>
        </div>
      </div>
    `).join('') : 
    '<div style="text-align:center; padding:2rem; color:#8b7355;">No results found</div>';
}

// Event Listeners
surahSelect.addEventListener('change', (e) => loadSurah(parseInt(e.target.value)));
autoPlayBtn.addEventListener('click', () => {
  autoPlayEnabled = !autoPlayEnabled;
  autoPlayBtn.classList.toggle('active', autoPlayEnabled);
});
reciterBtn.addEventListener('click', () => {
  const idx = reciters.findIndex(r => r.id === currentReciter);
  currentReciter = reciters[(idx + 1) % reciters.length].id;
  reciterBtn.textContent = reciters[(idx + 1) % reciters.length].name.split(' ')[0];
});
stopAudioBtn.addEventListener('click', stopAudio);
searchBtn.addEventListener('click', performSearch);
searchInput.addEventListener('keypress', (e) => e.key === 'Enter' && performSearch());
clearSearchBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchQuery = '';
  renderVerses(currentSurahData);
});
prevSurahBtn.addEventListener('click', () => currentSurahNumber > 1 && loadSurah(currentSurahNumber - 1));
nextSurahBtn.addEventListener('click', () => currentSurahNumber < 114 && loadSurah(currentSurahNumber + 1));
clearBookmarksBtn.addEventListener('click', () => {
  if (bookmarks.size && confirm('Clear all bookmarks?')) {
    bookmarks.clear();
    updateBookmarks();
    renderVerses(currentSurahData);
  }
});

// Swipe navigation
let touchX = 0;
versesContainer.addEventListener('touchstart', e => touchX = e.changedTouches[0].screenX);
versesContainer.addEventListener('touchend', e => {
  const diff = touchX - e.changedTouches[0].screenX;
  if (Math.abs(diff) > 80) {
    diff > 0 && currentSurahNumber < 114 ? loadSurah(currentSurahNumber + 1) :
    diff < 0 && currentSurahNumber > 1 ? loadSurah(currentSurahNumber - 1) : null;
  }
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') stopAudio();
  if (e.key === ' ' && e.target === document.body) {
    e.preventDefault();
    currentAudio?.[currentAudio.paused ? 'play' : 'pause']();
  }
});

// Init
(async () => {
  updateBookmarks();
  await fetchSurahs();
  await loadSurah(1);
  console.log('✅ Quran App Ready');
  console.log('📱 PWA install prompt will appear in 3 seconds');
})();
</script>
